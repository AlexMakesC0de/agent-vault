name: Bug report
description: Something does not work as the docs say
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove personal paths, names and memory content before posting. For security problems, follow SECURITY.md instead.
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: The command or agent action, and where you ran it from.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Error output, or the output of `router.py doctor`.
      render: text
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and Python version
      placeholder: Windows 11, Python 3.13
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Agent client
      multiple: true
      options: [Claude Code, Codex, Other]
